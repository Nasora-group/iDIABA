name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const audit=require('./npm-audit.json'); for (const [name, item] of Object.entries(audit.vulnerabilities || {})) console.log(name + ': ' + item.severity + '; range=' + item.range + '; fix=' + JSON.stringify(item.fixAvailable));"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
